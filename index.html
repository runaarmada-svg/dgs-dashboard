<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Antrian Puskesmas Piyungan</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            🏥
        </div>

        <h1>PUSKESMAS PIYUNGAN</h1>

        <h2>ANTRIAN PELAYANAN</h2>

        <p class="subtitle">
            Silakan datang ketika nomor antrean Anda sudah mendekati giliran.
        </p>

        <div id="clock" class="clock">
            00:00:00 WIB
        </div>

    </header>


    <!-- ================= CARD CONTAINER ================= -->

    <main>

        <section id="cards" class="cards">

            <!--
                Card akan dibuat otomatis oleh script.js

                Contoh:

                UMUM 1 POLI RUJUKAN
                A-039

                GIGI
                B-029

                dst...
            -->

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="update-title">

            Terakhir diperbarui

        </div>

        <div id="lastUpdate" class="update-time">

            --

        </div>

        <div id="connection" class="connection online">

            🟢 ONLINE

        </div>

        <div class="refresh-info">

            Data otomatis diperbarui setiap 30 detik

        </div>

    </footer>


    <!-- Javascript -->

    <script src="script.js"></script>

</body>

</html>
